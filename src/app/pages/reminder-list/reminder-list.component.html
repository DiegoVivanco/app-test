<ion-header>
  <ion-toolbar>
    <ion-title>Mis Recordatorios</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToAddReminderPage()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngIf="reminders && reminders.length > 0; else noReminders">
    <ion-item *ngFor="let reminder of reminders">
      <ion-label>
        <h2>{{ reminder.text }}</h2>
        <p>Hora: {{ reminder.time }}</p>
        <p>Frecuencia: {{ getFrequencyText(reminder) }}</p>
        <p>Estado: {{ reminder.enabled ? 'Activado' : 'Desactivado' }}</p>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button (click)="goToEditReminderPage(reminder.id)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
  <ng-template #noReminders>
    <div style="text-align: center; padding-top: 20px;">
      <p>Aún no hay recordatorios. ¡Añade uno!</p>
    </div>
  </ng-template>
</ion-content>
