<ion-app>
  <ion-router-outlet></ion-router-outlet>

  <!-- Web Debug Helper -->
  <div *ngIf="!isCordova" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(240, 240, 240, 0.9); padding: 8px; border-top: 1px solid #ccc; z-index: 9999; text-align: center; font-family: monospace; font-size: 11px;">
    <p style="margin:0; padding: 2px;"><b>WEB DEBUG MODE</b></p>
    <p style="margin:0; padding: 2px;">Use browser console: <code>window.simulateNotificationTrigger(&#123; reminderId: 'ID', type: 'initial' &#125;)</code></p>
    <p style="margin:0; padding: 2px;">Or: <code>window.simulateNotificationTrigger(&#123; reminderId: 'ID', type: 'hourly', hourOfDay: HH &#125;)</code></p>
  </div>
</ion-app>
